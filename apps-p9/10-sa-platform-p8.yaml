# Conservacion de la Practica 8: misma Application (sa-platform-p8 / sa-p8 / manifests), ahora hija de root-p9.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-platform-p8
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/Afedo23/software-avanzado-gitops.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - .spec.rules[]?.skipBackgroundRequests
        - .spec.rules[]?.validate?.allowExistingViolations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false          # el namespace lo crea Terraform
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true   # ClusterPolicy/SealedSecret/Rollout: sus CRD llegan en la wave 0
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
