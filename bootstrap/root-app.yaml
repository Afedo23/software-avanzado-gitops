# Aplicacion RAIZ (app-of-apps) de la Practica 9.
# Terraform la aplica UNA vez (P9/terraform/argocd.tf, leyendola desde este archivo en Git).
# Todo lo demas lo declara el directorio apps-p9/: una Application por componente, con sync-waves.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-p9
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Afedo23/software-avanzado-gitops.git
    targetRevision: main
    path: apps-p9
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
