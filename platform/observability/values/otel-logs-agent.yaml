# Agente de registros (DaemonSet): lee los logs JSON de los contenedores de sa-p8, extrae trace_id
# y los envia a Loki por OTLP. trace_id queda como metadata estructurada consultable por campo.
mode: daemonset
fullnameOverride: otel-logs
image:
  repository: otel/opentelemetry-collector-contrib
presets:
  logsCollection: { enabled: true, includeCollectorLogs: false }
  kubernetesAttributes: { enabled: true }
resources:
  requests: { cpu: 50m, memory: 96Mi }
  limits: { cpu: 300m, memory: 256Mi }
config:
  receivers:
    jaeger: null
    prometheus: null
    zipkin: null
    otlp: null
  processors:
    memory_limiter: { check_interval: 1s, limit_percentage: 75, spike_limit_percentage: 20 }
    filter/solo-sa-p8:
      error_mode: ignore
      logs:
        log_record:
          - 'resource.attributes["k8s.namespace.name"] != "sa-p8"'
    transform/json:
      error_mode: ignore
      log_statements:
        - context: log
          statements:
            - merge_maps(attributes, ParseJSON(body), "upsert") where IsMatch(body, "^\\{")
            - set(severity_text, attributes["level"]) where attributes["level"] != nil
            - set(trace_id.string, attributes["trace_id"]) where attributes["trace_id"] != nil
            - set(span_id.string, attributes["span_id"]) where attributes["span_id"] != nil
        - context: resource
          statements:
            - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["k8s.container.name"] != nil
    batch: { timeout: 2s }
  exporters:
    otlphttp/loki:
      endpoint: http://loki.observabilidad.svc.cluster.local:3100/otlp
      tls: { insecure: true }
  service:
    pipelines:
      logs:
        receivers: [filelog]
        processors: [memory_limiter, k8sattributes, filter/solo-sa-p8, transform/json, batch]
        exporters: [otlphttp/loki]
      traces: null
      metrics: null
