# Collector (gateway): recibe OTLP de los servicios y reenvia las TRAZAS a Tempo.
# Las metricas las recoge Prometheus directamente de cada pod (PodMonitor); los registros los lleva otel-logs-agent.
mode: deployment
fullnameOverride: otel-collector
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 300m, memory: 384Mi }
ports:
  otlp: { enabled: true, containerPort: 4317, servicePort: 4317, protocol: TCP }
  otlp-http: { enabled: true, containerPort: 4318, servicePort: 4318, protocol: TCP }
  jaeger-compact: { enabled: false }
  jaeger-thrift: { enabled: false }
  jaeger-grpc: { enabled: false }
  zipkin: { enabled: false }
config:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: "0.0.0.0:4317" }
        http: { endpoint: "0.0.0.0:4318" }
  processors:
    memory_limiter: { check_interval: 1s, limit_percentage: 75, spike_limit_percentage: 20 }
    batch: { timeout: 2s }
  exporters:
    otlp/tempo:
      endpoint: tempo.observabilidad.svc.cluster.local:4317
      tls: { insecure: true }
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo]
      metrics: null
      logs: null
