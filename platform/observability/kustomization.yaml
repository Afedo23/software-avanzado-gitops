apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observabilidad
resources:
  - podmonitors.yaml
  - prometheusrule-slo.yaml
  - prometheusrule-alertas.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: dashboard-operacion
    files:
      - operacion.json=dashboards/operacion.json
    options:
      labels:
        grafana_dashboard: "1"
