# P10: servicio de autenticacion de usuarios, instrumentado con OpenTelemetry. Mismo patron que api-gateway.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: auth
  namespace: sa-p8
  labels:
    app: auth
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      automountServiceAccountToken: false
      # P9: repartir las replicas entre nodos para sobrevivir a la perdida de uno.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: auth
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: auth
      securityContext:
        runAsNonRoot: true
      containers:
        - name: auth
          # kustomize (images:) sobreescribe este tag; NUNCA se usa "latest".
          image: ghcr.io/afedo23/sa-p8/auth-service:0.0.0-placeholder
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9464
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: OTEL_SERVICE_NAME
              value: auth
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observabilidad.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_PROPAGATORS
              value: tracecontext,baggage
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=sa-p8,k8s.pod.name=$(POD_NAME)
            - name: METRICS_PORT
              value: "9464"
            - name: LOG_FORMAT
              value: json
            - name: AUTH_SERVICE_URL
              value: http://auth.sa-p8.svc.cluster.local:8080
            - name: SOLICITUDES_SERVICE_URL
              value: http://solicitudes.sa-p8.svc.cluster.local:8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15

  # P10: canary gobernado por METRICAS REALES (Prometheus), ya no por un Job sintetico.
  # Sin trafico no hay evidencia, asi que el trafico lo genera el Deployment loadgen (loadgen.yaml).
  strategy:
    canary:
      steps:
        - setWeight: 20
        - analysis:
            templates:
              - templateName: canary-metricas-prometheus
            args:
              - name: app
                value: auth
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - analysis:
            templates:
              - templateName: canary-metricas-prometheus
            args:
              - name: app
                value: auth
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 100
