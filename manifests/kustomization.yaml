apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- rollout-api-gateway.yaml
- analysistemplate-api-gateway.yaml
- service-api-gateway.yaml
  # A medida que agregues los otros 7 servicios (Deployment u otro Rollout),
  # sus manifiestos se listan aqui tambien.

# El pipeline (job update-gitops-pr) corre:
#   kustomize edit set image ghcr.io/OWNER/sa-p8/api-gateway=ghcr.io/OWNER/sa-p8/api-gateway:X.Y.Z
# lo que reescribe SOLO esta seccion. Nunca se usa "latest".
images:
- name: ghcr.io/afedo23/sa-p8/api-gateway
  newName: ghcr.io/afedo23/sa-p8/api-gateway
  newTag: 1.1.2
