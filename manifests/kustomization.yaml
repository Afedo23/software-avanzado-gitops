apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- rollout-api-gateway.yaml
- analysistemplate-canary-metricas.yaml
- service-api-gateway.yaml
- rollout-auth.yaml
- service-auth.yaml
- rollout-solicitudes.yaml
- service-solicitudes.yaml
- loadgen.yaml
- pdb-api-gateway.yaml
- policies
  # A medida que agregues los otros 7 servicios (Deployment u otro Rollout),
  # sus manifiestos se listan aqui tambien.

# El pipeline (job update-gitops-pr) corre:
#   kustomize edit set image ghcr.io/OWNER/sa-p8/api-gateway=ghcr.io/OWNER/sa-p8/api-gateway:X.Y.Z
# lo que reescribe SOLO esta seccion. Nunca se usa "latest".
images:
- name: ghcr.io/afedo23/sa-p8/auth-service
  newName: ghcr.io/afedo23/sa-p8/auth-service
  newTag: 0.0.0-placeholder   # lo reescribe el job update-gitops-pr
- name: ghcr.io/afedo23/sa-p8/solicitudes-service
  newName: ghcr.io/afedo23/sa-p8/solicitudes-service
  newTag: 0.0.0-placeholder
- name: ghcr.io/afedo23/sa-p8/api-gateway
  newName: ghcr.io/afedo23/sa-p8/api-gateway
  newTag: 1.1.1
